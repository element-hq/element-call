name: Build & publish full packages for releases

on:
  release:
    types: [published]

env:
  VERSION: ${{ github.event.release.tag_name }}

permissions: {}

jobs:
  build_element_call:
    permissions:
      contents: read
    uses: $/.github/workflows/build-element-call.yaml
    with:
      package: full
      vite_app_version: ${{ github.event.release.tag_name }} # Using ${{ env.VERSION }} here doesn't work
    secrets:
      SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
      SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
      SENTRY_URL: ${{ secrets.SENTRY_URL }}
      SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}

  publish_tarball:
    needs: build_element_call
    if: always()
    name: Publish tarball
    runs-on: ubuntu-24.04
    permissions:
      contents: write # required to upload release asset
      packages: write
    steps:
      - name: Determine filename
        run: echo "FILENAME_PREFIX=element-call-${VERSION:1}" >> "$GITHUB_ENV"
      - name: 📥 Download built element-call artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ github.event.workflow_run.id || github.run_id }}
          name: build-output-full
          path: ${{ env.FILENAME_PREFIX }}
      - name: Create Tarball
        run: tar --numeric-owner --transform "s/dist/${FILENAME_PREFIX}/" -cvzf ${FILENAME_PREFIX}.tar.gz ${FILENAME_PREFIX}
      - name: Create Checksum
        run: find ${FILENAME_PREFIX} -type f -print0 | sort -z | xargs -0 sha256sum | tee ${FILENAME_PREFIX}.sha256
      - name: Upload
        run: gh release upload "$VERSION" "${FILENAME_PREFIX}.tar.gz" "${FILENAME_PREFIX}.sha256" --clobber
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}

  publish_docker:
    needs: build_element_call
    if: always()
    name: Publish docker
    permissions:
      contents: write
      packages: write
      id-token: write
    uses: $/.github/workflows/build-and-publish-docker.yaml
    secrets:
      TS_OAUTH_CLIENT_ID: ${{ secrets.TS_OAUTH_CLIENT_ID }}
      TS_AUDIENCE: ${{ secrets.TS_AUDIENCE }}
    with:
      artifact_run_id: ${{ github.event.workflow_run.id || github.run_id }}
      docker_tags: |
        type=sha,format=short,event=branch
        type=raw,value=${{ github.event.release.tag_name }}
        type=raw,value=latest
      # Like before, using ${{ env.VERSION }} above doesn't work
  add_docker_release_note:
    needs: publish_docker
    name: Add docker release note
    runs-on: ubuntu-24.04
    # Shared with publish-component.yaml and publish-embedded-packages.yaml, which append
    # to the same release. GitHub lets only one job wait per group, so if all three arrive at once the
    # waiting one is cancelled: re-run it. To mitigate this, the append exits early when its
    # heading already exists.
    concurrency:
      group: release-notes-${{ github.event.release.tag_name || github.run_id }}
      cancel-in-progress: false
    permissions:
      contents: write # to update release notes
    steps:
      - name: Add release note
        run: |
          gh release view "$VERSION" --json body --jq .body > release-body.md
          if grep -qF "$HEADING" release-body.md; then
            echo "Section already present, nothing to add"
            exit 0
          fi
          printf '\n%s\n' "$NOTES" >> release-body.md
          gh release edit "$VERSION" --notes-file release-body.md
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          HEADING: "## Docker full package"
          NOTES: |
            ## Docker full package
            Element Call is available as a Docker image from the [GitHub Container Registry](https://github.com/element-hq/element-call/pkgs/container/element-call).

            The image provides a full build of Element Call that can be used both in standalone and as a widget (on a remote URL).

            ```
            docker pull ghcr.io/element-hq/element-call:${{ env.VERSION }}
            ```
